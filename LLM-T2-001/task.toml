schema_version = "1.4"

artifacts = [
  "/app/output/backend_service.py",
]

[task]
name = "acme-eval/llm-t2-001"
version = "1.0.0"
description = "编写支持异构设备和多模态路由的大模型推理后端服务"
authors = [{ name = "Evaluator", email = "evaluator@example.com" }]
keywords = ["backend", "rabbitmq"]

[metadata]
task_id = "LLM-T2-001"
domain = "人工智能"
category_l1 = "后端开发"
category_l2 = "服务中间件"
scene_l3 = "大模型应用框架"
capabilities = "消息队列通信、多态路由设计、异常处理"
office_task_type = "T2代码生成"
difficulty = "L4"
difficulty_explanation = "涉及工厂模式、队列状态管理和特定场景的路由逻辑"
vl_dependency = "不依赖vl"
source_note = "内部应用框架解耦重构任务"
tools = "Python/pika"
expert_minutes = 60

[[metadata.deliverables]]
path = "backend_service.py"
required = true
desc = "主交付物：基于 RabbitMQ 的推理服务代码"

[[metadata.rubric_index]]
id = "R1"
dimension = "指令遵循-交付物正确性"
criterion_type = "Objective"
criterion_necessity = "Explicit"
weight = 5.0
gating = false

[[metadata.rubric_index]]
id = "R2"
dimension = "交付物内容质量-业务逻辑"
criterion_type = "Objective"
criterion_necessity = "Explicit"
weight = 10.0
gating = false

[[metadata.rubric_index]]
id = "G1"
dimension = "安全合规"
criterion_type = "Objective"
criterion_necessity = "Explicit"
gating = true

[agent]
timeout_sec = 3600.0
user = "agent"

[verifier]
timeout_sec = 2400.0
user = "root"
environment_mode = "separate"

[verifier.environment]
network_mode = "allowlist"
# 这里只放行真正的 OpenAI 地址
allowed_hosts = ["api.openai.com", "raw.githubusercontent.com"]
cpus = 2
memory_mb = 4096

[verifier.env]
# 这里只保留钥匙，告诉 LiteLLM 丢弃乱七八糟的参数
OPENAI_API_KEY = "${OPENAI_API_KEY}"
LITELLM_DROP_PARAMS = "True"

[environment]
os = "linux"
build_timeout_sec = 1800.0
network_mode = "no-network"
cpus = 2
memory_mb = 8192
storage_mb = 10240