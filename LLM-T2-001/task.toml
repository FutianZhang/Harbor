[agent]
timeout_sec = 7200.0
user = "agent"

[verifier]
timeout_sec = 2700.0
user = "root"
environment_mode = "separate"

[verifier.environment]
network_mode = "allowlist"
# 这里只放行真正的 OpenAI 地址
allowed_hosts = [
  "api.openai.com", 
  "raw.githubusercontent.com",
  "nvidia.com",
  "nvidia.cn",
  "broadcom.com",
  "lumentum.com",
  "coherent.com",
  "tsmc.com",
  "ieee.org",
  "opencompute.org",
  "github.com",
  "arxiv.org",
  "wikipedia.org",
  "google.com",
  "bing.com",
]
cpus = 2
memory_mb = 4096

[verifier.env]
# 这里只保留钥匙，告诉 LiteLLM 丢弃乱七八糟的参数
OPENAI_API_KEY = "${OPENAI_API_KEY}"
LITELLM_DROP_PARAMS = "True"

[environment]
os = "linux"
build_timeout_sec = 1800.0
network_mode = "no-network"
cpus = 2
memory_mb = 8192
storage_mb = 30720