difficulty_explanation = "L5长程：跨ISO 27001与等保2.0双框架、多格式Prowler证据与五态判定，需完成不少于15轮控制映射-证据核验-差距裁定-整改排期，专家人时约48小时。不构成认证结论。"
vl_dependency = "弱依赖vl"
source_note = "训练评估人员识别扫描状态与证据文本冲突、区分Scored与Not Scored，并在标准正文受版权保护时使用合法摘要和官方登记信息。任务对应真实企业付费安全工作；核心证据来自公开仓库固定提交，场景包装在来源清单中单独标识，标准交付物为管理报告与可执行台账。"
tools = "PDF/文档排版工具、Excel或同类表格工具、Python数据与日志分析工具、本地离线安全分析工具"
expert_minutes = 2880

