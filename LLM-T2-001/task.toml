# 这里只放行真正的 OpenAI 地址
allowed_hosts = [
  "api.openai.com",
  "raw.githubusercontent.com",
  "pypi.org",
  "files.pythonhosted.org",
]
cpus = 2
memory_mb = 4096

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL}"

[environment]
os = "linux"
build_timeout_sec = 18000.0
