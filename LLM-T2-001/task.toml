[task]
name = "zyt/cfe-opt-003"
version = "1.0.0"
description = "实现离线、确定性的 BTC/ETH 欧式期权组合风险与 PnL 引擎"
keywords = ["financial-engineering", "office", "L4"]

[metadata]
task_id = "CFE-OPT-003"
domain = "coding交叉长尾"
category_l1 = "金融工程/量化"
category_l2 = "衍生品定价与风险管理"
scene_l3 = "加密货币期权组合PnL与风险计算"
capabilities = "欧式期权定价与 Greeks、持仓重建、组合估值、PnL accounting、PnL attribution、full-repricing stress、输入校验与确定性工程实现"
office_task_type = "其他"
difficulty = "L4"
vl_dependency = "不依赖vl"
source_note = "映射到量化交易或衍生品风险团队的日终期权组合风险与PnL计算引擎开发任务；输入基于公开 Deribit mainnet 市场结构数据并进行确定性高仿真组合构造；真实场景交付物为可运行的期权风险计算程序及日终持仓、估值、Greeks、PnL归因、压力测试和校验结果。"
tools = "Python"
expert_minutes = 960

