schema_version = "1.4"

artifacts = [
  "/app/output/猕猴桃采后GA3处理验证及供应链应用评估报告.docx",
  "/app/output/猕猴桃采后GA3处理分析与应用测算底稿.xlsx",
]

[task]
name = "siruiqi/ag-t8-057"
version = "2.0.2"
description = "面向果品供应链企业对猕猴桃采后 GA₃ 处理方案的内部决策评估，综合采后小试、表型图像、采购库存、报损折价、销售退货、冷链质检、处理成本和渠道动销台账，结合公开科研、标准、登记、标签及监管资料，复核成熟进程与品质差异，建立经营基线和可调整情景测算，区分事实、假设与合规边界，评估损耗、折价、退货、可售窗口、新增成本和项目净价值影响，并形成下一阶段验证路线与阶段门决策建议。"
keywords = ["采后", "猕猴桃", "供应链", "office", "统计"]

[metadata]
task_id = "AG-T8-057"
domain = "农业"
category_l1 = "6. 采后质量、市场与可持续"
category_l2 = "6.1 采收、分级、储运与追溯"
scene_l3 = "成熟度判定与采收窗口排程"
capabilities = "采后多指标轨迹判读、试验统计复核、批次与台账对账、经营基线构建、情景测算、科研证据分层、冷链外推判断、植物生长调节剂合规评估、阶段门与停止条件设计、跨产物一致性控制、Word报告与Excel模型编制"
office_task_type = "T8全流程"
difficulty = "L5"
vl_dependency = "强依赖vl"
source_note = "本地材料包含猕猴桃采后试验工作簿、表型图像、供应链经营记录和处理成本样例；科研论文、法规标准、登记与标签等公开证据需被测 agent 自行检索并在交付物中记录来源、检索日期和适用边界。"
tools = ["Word", "Excel", "Python", "统计分析", "数据可视化", "公开资料检索", "法规资料核验"]
expert_minutes = 3000

[[metadata.deliverables]]
