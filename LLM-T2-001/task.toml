source_note = "来源于真实农业科研院所采后生理实验场景。台农芒果采后糖处理实验是果蔬采后研究中的常见实验设计，考察外源糖对呼吸跃变型果实后熟的调控机制。实验数据（TSS、硬度、蔗糖含量、I₂-KI染色）为真实测定数据。真实场景中的交付物是课题组的组会汇报PPT。"
tools = ["PowerPoint", "Excel", "统计分析软件","ocr"]
expert_minutes = 300
