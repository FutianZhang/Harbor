[task]
name = "15/ag-t8-030"
version = "1.1.0"
description = "基于草莓静磁场小试与项目主数据完成多基地确证设计、效果评价、商业转化与阶段决策"
keywords = ["agriculture", "postharvest", "multi-site-trial", "mixed-effects", "decision-support", "office", "L5"]

[metadata]
task_id = "AG-T8-030"
domain = "农业"
category_l1 = "3. 精准农业与生产分析"
category_l2 = "3.2 产量预测与田间试验"
scene_l3 = "田间试验设计与效果评价"
capabilities = "小试证据复核、多基地多品种跨产季确证设计、样本量与损耗冗余、因子与随机区组设计、盲法和样本链路、设备三维测场与环境协变量、混合效应和生存分析、公式与口径复核、批次经营对账、投资敏感性、风险与RCA、24轮阶段评审、部署SOP、跨产物一致性控制"
office_task_type = "T8全流程"
difficulty = "L5"
vl_dependency = "强依赖vl"
source_note = "草莓冷藏小试测量、表型图像、多基地确证项目主数据、设备环境方案和经营台账"
tools = "Word文档编辑、Excel数据处理与公式建模、统计分析与复核、数据可视化、图像证据核验"
expert_minutes = 6000

[[metadata.deliverables]]
path = "草莓静磁场冷藏试验评估与转化验证报告.docx"
required = true
desc = "小试评价、多基地确证设计、设备环境、统计计划、经营测算、风险与部署决策报告"

