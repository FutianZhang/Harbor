[judge]
judge = "openai/gpt-5.6-luna"
files = ["/app/output/《中国东盟营销环境与策略》教学进度表.docx"]
mode = "individual"

[[criterion]]
id = "R18"
description = '排课行星期列必须为"四"或"五"（即周四、周五上课）。只要出现任何一行有实际排课内容（周次或授课内容列非空）但星期列不是"四"或"五"的排课行，视为严重错误一票否决。'
type = "binary"

[[criterion]]
id = "R21G"
description = '排课周次范围必须在第 4-12 周内且必须正确跳过国庆假期（第 5 周）。以下任一情况出现均一票否决：(1) 任何排课行周次 <4 或 >12；(2) 第 5 周出现排课行（国庆假期周不应排课）；(3) 文档中未提及任何假期关键词（"国庆""放假""假期""中秋"）。'
type = "binary"

[[criterion]]
id = "R04G"
description = '教学大纲中 13 个教学单元均需在进度表中达到 100% 覆盖，缺 1 个即一票否决：3 个综合性单元（东南亚市场概述/东南亚市场调查/东南亚市场营销）必须独立出现，不得合并；10 个国别单元（泰国/马来西亚/新加坡/文莱/印尼/菲律宾/越南/柬埔寨/老挝/缅甸）可自由选择任意组合进行合并排列（如"老挝+缅甸"、"新加坡+文莱"、"柬埔寨+菲律宾"等），但每个国家都必须在进度表的授课内容中出现至少一次。13 个单元全部出现（含合并命中）视为通过；缺任意 1 个单元即视为不通过，一票否决。'
type = "binary"

[scoring]
aggregation = "all_pass"