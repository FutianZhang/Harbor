[judge]
judge = "openai/gpt-5.6-luna"
files = ["/app/output/26.3.4 Nvidia CPO.docx"]
mode = "individual"

[[criterion]]
id = "G01"
description = "报告严重偏离任务主题，未围绕“英伟达及CPO技术”进行分析，大幅篇章讨论无关主题内容。"
type = "binary"
negate = true

[[criterion]]
id = "G02"
description = "报告整体对英伟达的产品线为负面评价，否定其产品线的市场价值。"

type = "binary"
negate = true


[[criterion]]
id = "G03"
description = "存在以下任一情况：（1）交付的文件非 .docx 格式，或为.docx 格式但无法在 Word 中正常打开，存在损坏/乱码/格式错乱情况。（2）报告不得出现非法信息、政治敏感内容或违规投资建议。"
type = "binary"
negate = true

[scoring]
aggregation = "all_pass"
