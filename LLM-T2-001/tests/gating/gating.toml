[judge]
judge = "openai/gpt-5.5"
files = [
  "/app/output/《中国东盟营销环境与策略》教学进度表.docx",
]
mode = "individual"

[[criterion]]
id = "G01"
description = "教学大纲中 13 个教学单元未在进度表中达到 100% 覆盖。缺任意 1 个单元即判违规：3 个综合性单元（东南亚市场概述/东南亚市场调查/东南亚市场营销）必须独立出现，不得合并；10 个国别单元（泰国/马来西亚/新加坡/文莱/印尼/菲律宾/越南/柬埔寨/老挝/缅甸）可自由选择任意组合进行合并排列（如\"老挝+缅甸\"、\"新加坡+文莱\"、\"柬埔寨+菲律宾\"等），但每个国家都必须在进度表的授课内容中出现至少一次。"
type = "binary"
negate = true

[[criterion]]
id = "G02"
description = "排课行星期列出现非\"四\"或\"五\"的值（即非周四、周五上课的排课行）。只要出现任何一行有实际排课内容（周次或授课内容列非空）但星期列不是\"四\"或\"五\"的排课行，即判违规。"
type = "binary"
negate = true

[[criterion]]
id = "G03"
description = "课程排布存在以下情况：(1) 排课起始时间早于9月22日；(2) 未正确跳过国庆假期（第 5 周）；(3) 除第5周节日跳过外，其余周次未保持连续；(4) 课时周次范围不在第 4-12 周内。"
type = "binary"
negate = true

[scoring]
aggregation = "all_pass"
