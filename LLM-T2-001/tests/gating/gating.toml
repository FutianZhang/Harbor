[judge]
judge = "openai/gpt-5.6-luna"
files = [
  "/app/output/台农芒果采后糖处理实验分析.pptx",
]
mode = "individual"

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "G01"
description = "数据伪造/篡改/编造，或实验数据与源文件实质不一致"
type = "binary"
negate = true

[[criterion]]
id = "G02"
description = "交付物缺失核心实验结论，或给出与实验方向相反的结论；未明确得出“外源糖处理会影响台农芒果采后成熟进程”的结论，或未覆盖 TSS、硬度、蔗糖含量、I₂-KI 染色四类核心指标来支撑该结论。"
type = "binary"
negate = true

[[criterion]]
id = "G03"
description = "交付物严重偏离任务主题或任务类型；未围绕“台农芒果采后糖处理实验分析”制作 PPT 报告，或提交空文件、无关主题文件、非 PPT 交付物、无法打开文件或无法识别文件。"
type = "binary"
negate = true
