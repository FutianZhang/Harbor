[judge]
judge = "openai/gpt-5.6-luna"
files = [
  "/app/output/猕猴桃采后GA3处理验证及供应链应用评估报告.docx",
  "/app/output/猕猴桃采后GA3处理分析与应用测算底稿.xlsx",
]
reference = "/tests/golden_output"
mode = "individual"
timeout = 900

[[criterion]]
id = "G1"
description = "未自行检索公开科研或监管资料，虚构来源、年份、机构、标准状态、论文结论或监管要求"
type = "binary"
negate = true

[[criterion]]
id = "G2"
description = "未提交任务指定的Word报告或Excel测算底稿，或任一必交物无法正常解析打开"
type = "binary"
negate = true

[[criterion]]
id = "G3"
description = "不包含以下核心模块中的关键内容，导致无法形成完整决策材料：采后实验结果分析、表型图或品质变化解读、供应链经营基线整理、经营情景测算、公开科研证据检索与适用边界说明、监管或合规边界判断、下一阶段验证路线与建议"
type = "binary"
negate = true

[scoring]
aggregation = "all_pass"
