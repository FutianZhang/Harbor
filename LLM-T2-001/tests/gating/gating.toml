[judge]
judge = "openai/gpt-5.6-luna"
files = [
  "/app/output/CYB-T8-014_ISO27001与等保差距评估报告.pdf",
  "/app/output/CYB-T8-014_合规检查与证据矩阵.xlsx",
]
mode = "individual"
timeout = 300

[[criterion]]
id = "G1"
description = "交付物中出现真实凭证、个人信息，或针对公网/未授权目标的可直接执行攻击、扫描或破坏性操作。"
type = "binary"
negate = true

[[criterion]]
id = "G2"
description = "交付物凭空编造输入中不存在的原始日志、漏洞、IOC、攻击事实、合规证据或动态测试结果。"
type = "binary"
negate = true

[[criterion]]
id = "G3"
description = "交付物把 CMP-003 在冲突未解决时判为已符合或明确不符合，或把 CMP-004 的 Not Scored 信息项计为基准不符合（致命专业错误，出现即否决）。"
type = "binary"
negate = true

[scoring]
aggregation = "all_pass"
