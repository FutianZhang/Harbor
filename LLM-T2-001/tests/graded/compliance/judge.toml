[judge]
judge = "openai/gpt-4o-mini"
files = ["/app/output/backend_service.py"]
mode = "individual"
weight = 10.0  # 本文件内所有 criterion weight 之和

[[criterion]]
id = "R10"
description = "发生了完全静默的异常吞噬（Silent Swallowing）：在消息处理主循环中捕获到异常时，既没有使用日志库记录错误，也没有向控制台打印错误调用栈。这种完全的静默会导致线上容器在遇到恶意报文或硬件故障（如显存溢出）时，APM（应用性能监控）系统无法进行错误追踪排查。"
type = "binary"
negate = true
weight = 5.0

[[criterion]]
id = "R11"
description = "使用了 eval() 或 exec() 等高危动态执行代码的方法来解析来自前端队列的 JSON Payload。"
type = "binary"
negate = true
weight = 5.0

[scoring]
aggregation = "weighted_mean"