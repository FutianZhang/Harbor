[judge]
judge = "openai/gpt-5.6-luna"
files = ["/app/output/《中国东盟营销环境与策略》教学进度表.docx"]
mode = "individual"
weight = 24.0


[[criterion]]
id = "R08"
description = '所有填写信息可溯源无捏造：文档中需出现 ≥12 个大纲关键词（东南亚/东盟/泰国/马来西亚/新加坡/印尼/菲律宾/文莱/越南/柬埔寨/老挝/缅甸/市场环境/营销策略/市场调查/绪论/小组展示/市场营销/市场概述），且不得出现捏造内容——具体表现为不得出现"案例分析.*华为/腾讯/阿里/小米"等外部企业案例、不得出现"实训基地/实习企业"等捏造实践场所、不得出现"外部专家/邀请讲座"等捏造人员。关键词 ≥12 个且无捏造得满分；8-11 个且无捏造得中分；5-7 个得低分；<5 个或出现捏造内容得 0 分。'
type = "binary"
weight = 3.0


[[criterion]]
id = "R05"
description = '课程内容周次编排疏密均衡：有授课内容的排课行数 ≥15 行、覆盖周次数 ≥7 周、且周次覆盖范围占排课跨度 ≥70% 得满分；12-14 行且覆盖率 ≥50% 得中分；8-11 行得低分；<8 行得 0 分。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R09"
description = '数据行全部填写真实内容：进度表正文表格中段（表头与教材参考书目行之间）不得出现完全空白的数据行（所有单元格均无内容）。出现 1 行无意义空行得中分；出现 ≥2 行得 0 分。尾部模板预留行不计。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R17"
description = '进度表正文中段信息栏需填写完整：课程名称行（"课程名称："后跟实际课程名）、授课班级行（"授课班级："后跟实际班级）、教研室签字行（含"教研室主任"或"签字"或"负责人"关键词）三行均需有实际内容（非模板占位空白）。三行全填得满分；填 2 行得中分；填 1 行得低分；全未填得 0 分。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R26"
description = '小组展示主题方向需与课程主题一致：课程主题为"中国-东盟营销环境分析与策略"，教学单元为各国市场营销（分析东盟各国当地营销环境与策略）。展示主题需聚焦于分析东盟当地企业的营销案例或该国本土化营销策略，而非中国企业出海/进入该国市场的策略。4 个展示主题中：(1) 至少 3 个主题聚焦当地企业或当地市场环境分析（含"当地""本土""该国""东盟"等关键词，而非"中国XX产品进入"）；(2) 主题不可偏移为中国企业出海视角（"中国XX产品进入XX市场""中国XX品牌进入"等表述视为偏移）。满足条件(1)且不触发条件(2)得满分；仅满足(1)或仅不触发(2)得中分；触发条件(2)偏移（≥3个主题为中国出海视角）得 0 分。'
type = "binary"
weight = 3.0


[[criterion]]
id = "R34"
description = '模板占位符未替换：文档中出现"XXXX"、"XX"、"待定"、"未填写"、"请填写"、"【】"等模板占位符或空白提示文字。出现任一处即判违规。'
type = "binary"
negate = true
weight = 3.0

[[criterion]]
id = "R35"
description = '格式破坏：表格断裂、文字重叠、段落格式混乱、页边距异常等影响阅读体验的排版问题。出现任一处即判违规。'
type = "binary"
negate = true
weight = 3.0

[[criterion]]
id = "R36"
description = '捏造信息：出现输入文件中不存在的课程名称、教师姓名、班级名称、开课部门等信息（如教师姓名不是课表中的真实教师、班级名称与课表不符等）。出现任一处即判违规。'
type = "binary"
negate = true
weight = 3.0

[scoring]
aggregation = "weighted_mean"