[judge]
judge = "openai/gpt-5.6-luna"
files = ["/app/output/26.3.4 Nvidia CPO.docx"]
mode = "individual"
weight = 39.0

[[criterion]]
id = "R01"
description = '核心洞察未凝练全文核心价值主张，缺少以下三个层面中的任一个：(1)核心技术价值主张；(2)英伟达的竞争路径逻辑（须有完整的战略闭环表述）；(3)本次投资是生态建设的组成部分而非孤立事件。仅泛泛复述投资事件背景而未点明竞争路径闭环逻辑。'
type = "binary"
weight = 6.0
negate = true

[[criterion]]
id = "R02"
description = '研究背景须准确交代投资事件全貌，以下四要素缺一不可：(1)时间；(2)金额：合计40亿美元，分别向两家被投公司各投入20亿美元；(3)对象；(4)技术方向。同时须交代签署多年期采购协议锁定产能这一关键条款。仅写"签署采购协议"而无具体说明的判0分。'
type = "binary"
weight = 4.0

[[criterion]]
id = "R03"
description = '投资主体概况须分别覆盖两家被投公司，每家均含核心业务概览、核心产品与技术（含具体产品类型及量化参数）、与英伟达的合作三个子模块。两家公司差异化定位须有明确区分。产品技术参数缺失、公司与产品对应关系张冠李戴、或两家公司拆解结构不对称的判0分。'
type = "binary"
weight = 6.0

[[criterion]]
id = "R04"
description = '正文未按模块组织，模块间无因果或递进关系，全文为无逻辑递进的平铺堆砌。'
type = "binary"
weight = 4.0
negate = true

[[criterion]]
id = "R05"
description = '标题层级（章/节/子节）须合理清晰，便于读者导航定位。若全文无标题分级或标题层级混乱则判0分。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R06"
description = '报告须交代投资背后的战略意图：须说明为何进行此次投资、该投资解决什么问题，而非仅复述投资事实。仅列投资金额和对象而无战略意图分析的判0分。'
type = "binary"
weight = 4.0

[[criterion]]
id = "R07"
description = '报告须覆盖硅光子技术与CPO的关系，说明硅光子作为CPO核心技术基础的作用。若全文未提及硅光子技术或未将其与CPO关联则判0分。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R08"
description = '报告须列出CPO领域主要玩家（不少于4家），说明各自在CPO领域的角色定位。若全文仅提及英伟达和被投公司而无其他行业参与者则判0分。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R09"
description = '参考文献未以2025–2026年信息为主，以过时资料作为核心参考依据，参考文献中2024年及以前来源占比超过60%。'
type = "binary"
weight = 3.0
negate = true

[[criterion]]
id = "R10"
description = '报告段落长度不均或信息密度极端不合理，存在大段无分隔的密集文字（连续段落超过500字无任何分段或结构化元素）。'
type = "binary"
weight = 3.0
negate = true

[scoring]
aggregation = "weighted_mean"