[judge]
judge = "openai/gpt-5.6-luna"
files = ["/app/output/《中国东盟营销环境与策略》教学进度表.docx"]
mode = "individual"
weight = 40.0

[[criterion]]
id = "R01"
description = '交付物为有效的 .docx 文件（zip 内含 word/document.xml），且能正常解析出段落与表格结构。文件损坏或无法解析得 0 分。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R02"
description = '基于模板原件填充而非新建文档：docx 内部 zip 文件列表与模板原件的匹配率达 100% 得满分；90%-99% 得中分；<90% 得 0 分。'
type = "binary"
weight = 7.0

[[criterion]]
id = "R02B"
description = '进度表正文表头需与模板表头逐字一致：表头 11 列需依次为"周次/星期/节次/授课内容/讲课/习题讨论/实验上机/作业安排/辅导安排/其它/执行情况"，列名、列数、列顺序均需完全匹配。完全一致得满分；缺列或列名错误 ≤2 处得中分；缺列或列名错误 ≥3 处得 0 分。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R06"
description = '合理解决学时矛盾：进度表需出现至少 2 处相邻单元合并（如"老挝+缅甸"、"新加坡+文莱"在授课内容列同框出现），并包含"小组展示"主题；大纲 11 个国家主题需全部出现。无合并且知识点有遗漏得 0 分。'
type = "binary"
weight = 7.0

[[criterion]]
id = "R07"
description = '输出进行校验：需出现"校验""合计""总计""总学时""共32学时"等校验性表述，或进度表所有排课行节次数累加等于大纲课内总学时 32。无校验且总数不等于 32 得 0 分。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R19"
description = '封面信息栏字段需与输入文件（教师课表、校历、大纲）逐个校验保持一致。检查以下 5 个字段：(1) 授课学期为"2025-2026学年第1学期"；(2) 课程名称含"中国东盟营销环境与策略"；(3) 授课教师姓名需与教师课表中标注的教师姓名一致（如"李林"）；(4) 授课班级需与课表中的教学班组成一致（如含"24数字经济（营销）1班"）；(5) 开课部门/所属部门需填写实际内容（非空白）。命中 ≥5 项得满分；4 项得中分；3 项得低分；<3 项得 0 分。'
type = "binary"
weight = 5.0

[[criterion]]
id = "R19B"
description = '进度表正文表格中段信息栏字段需与输入文件保持一致。检查以下 3 个字段：(1) 中段信息栏的课程名称行需与输入课程名称一致；(2) 中段信息栏的授课班级行需与输入班级一致；(3) 中段信息栏的教研室签字行需填写实际内容（非空白）。3 项全命中得满分；2 项得中分；1 项得低分；全未命中得 0 分。'
type = "binary"
weight = 5.0

[[criterion]]
id = "R25"
description = '联系电话需填写实际号码：进度表中段信息栏"联系电话："冒号后需跟实际电话号码（数字或含连字符/括号的号码格式，非空白、非模板占位符如"XX"或"XXX"）。填写实际号码得满分；留空白或保留模板占位符得 0 分。'
type = "binary"
negate = true
weight = 7.0

[scoring]
aggregation = "weighted_mean"