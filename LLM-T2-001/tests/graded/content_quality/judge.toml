[judge]
judge = "openai/gpt-4o-mini"
files = ["/app/output/backend_service.py"]
mode = "individual"
weight = 34.0  # 本文件内所有 criterion weight 之和

[[criterion]]
id = "R4"
description = "解析前端传来的 message 时，动态提取了 base_model_path 和 device 等参数用于后续推理，没有全部硬编码。"
type = "binary"
weight = 5.0

[[criterion]]
id = "R5"
description = "实现了根据 base_model_path 包含的特定字符串（如 vision / instruct / chat）分配给不同推理 Handler 实例的分支逻辑。"
type = "binary"
weight = 8.0

[[criterion]]
id = "R6"
description = "实现了 Handler 实例的内存缓存机制（如使用字典结构存储实例化后的模型），保证接收新消息时复用已有 Handler，避免重复读盘和实例化模型。"
type = "binary"
weight = 6.0

[[criterion]]
id = "R7"
description = "针对 Vision 多模态模型，将输入结构化拼装为了包含 'image url' 和 'text' 类型的列表/字典格式（而非单纯的字符串拼接）交给模型。"
type = "binary"
weight = 6.0

[[criterion]]
id = "R8"
description = "发生了完全静默的异常吞噬（Silent Swallowing）：在消息处理主循环中捕获到异常时，既没有使用日志库记录错误，也没有向控制台打印错误调用栈。这种完全的静默会导致线上容器在遇到恶意报文或硬件故障（如显存溢出）时，APM（应用性能监控）系统无法进行错误追踪排查。"
weight = 5.0

[[criterion]]
id = "R9" 
description = "推理结果格式化安全：在提取模型响应（extract_model_answer）后，执行了防御性的清洗逻辑（如调用 strip() 去除 API 响应首尾的多余空白符或不可见换行），保障了投递到下游系统或前端界面的 JSON Payload 结构稳定性。"
type = "binary"
weight = 4.0

[scoring]
aggregation = "weighted_mean"