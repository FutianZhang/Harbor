[judge]
judge = "openai/gpt-5.6-luna"
files = ["/app/output/《中国东盟营销环境与策略》教学进度表.docx"]
mode = "individual"
weight = 82.0

[[criterion]]
id = "R03"
description = '授课内容引用大纲原文且使用规范编号格式：进度表授课内容列需逐字引用大纲原文的教学单元标题（不得篡改或自拟标题），且使用"第N讲"编号格式至少出现 10 处。"第N讲"格式 ≥10 处且内容源自大纲得满分；≥7 处得中分；≥4 处得低分；<4 处或出现大纲中不存在的自拟单元标题得 0 分。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R10"
description = '排课正确性：周次升序连续（除假期情况），节次仅有3-4节可排课，课程跨度为9周。'
type = "binary"
weight = 9.0

[[criterion]]
id = "R11"
description = '正确跳过节假日周次：进度表周次列需出现至少 1 处跳号（gap>1，如从第4周跳到第6周），表明已跳过国庆/中秋等假期周次。无跳号得 0 分。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R12"
description = '进度表所有排课行的节次数累加等于大纲课内总学时 32：精确等于 32 得满分；差值 ≤2 得中分；差值 3-6 得低分；差值 >6 或无法计数得 0 分。节次列格式为"1-4"（表示 4 节）或单数字。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R13"
description = '理论课时与实践课时需符合大纲：进度表正文表格"讲课"列标记 √ 的节次累加为理论学时，"实验/上机"列标记 √ 的节次累加为实践学时。大纲要求 32 理论 0 实践：实践学时=0 且理论学时>0 得满分；实践学时 1-4 得中分；实践学时 >4 得 0 分。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R14"
description = '平时成绩考核方案需包含两个标题段落：(1) 文档中需出现"课堂表现"标题或段落标识（如"课堂表现："、"课堂表现部分"）；(2) 需出现"作业成绩"标题或段落标识（如"作业成绩："、"作业成绩部分"）。同时需明确表述平时成绩由这两部分组成。两部分标题均有且表述完整得满分；仅有 1 个标题得低分；均无或无考核方案段得 0 分。'
type = "binary"
weight = 9.0

[[criterion]]
id = "R15"
description = '封面信息完整填写：以下 7 个字段需全部填写且冒号后跟实际内容（非空白）：授课学期、教研室、授课教师、授课班级、课程名称、开课部门、日期（格式 20XX年X月X日）。填写 ≥7 个得满分；5-6 个得中分；3-4 个得低分；<3 个得 0 分。保留模板默认日期（如 XXXX 或仅"年月日"无数字）不计为已填写。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R16"
description = '进度表正文表格的"使用教材"行需填写书名+出版社（"出版社"或"出版"关键词需出现），"参考书目"行需列出至少 2 本参考书（按 1、2、3 编号计数）。教材完整且参考书 ≥2 本得满分；教材无出版社或参考书仅 1 本得中分；仅有教材或仅有参考书得低分；两者皆无得 0 分。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R20"
description = '讲课课时与学生展示课时比例为 24:8：进度表正文表格"讲课"列标记 √ 的排课行节次累加需等于 24（讲课学时），"其它"列含"展示""√""学生展示"等标记的排课行节次累加需等于 8（展示学时）。讲课=24 且展示=8 得满分；仅讲课=24 或仅展示=8 得中分；两者均不符得 0 分。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R22"
description = '学生展示主题需符合课程含义、包含案例分析、4 个主题存在差异：(1) 展示主题数量 ≥4；(2) 至少 1 个主题含"案例分析"关键词；(3) 至少 2 个主题含课程相关关键词（东盟/东南亚/营销/市场/泰国/马来西亚/新加坡/印尼/菲律宾/文莱/越南/柬埔寨/老挝/缅甸）；(4) 去重后主题数 ≥3。4 项全中得满分；3 项得中分；2 项得低分；<2 项得 0 分。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R24"
description = '课程类型需正确勾选：前 24 课时（讲课行）的"讲课"列需标记 √，后 8 课时（学生展示行）的"其它"列需标记 √或含"展示"关键词，且讲课行在前、展示行在后（展示行不能出现在讲课行之前）。讲课 √ 行课时=24、展示行课时=8、且顺序正确得满分；课时正确但顺序错误得中分；课时不正确得 0 分。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R28"
description = '课程类型/内容勾选栏必须有 √ 勾选且符合文件要求格式：进度表正文表格的"讲课""习题/讨论""实验/上机""作业安排""辅导安排""其它"六列中，排课行需使用 √ 标记对应课程类型，√ 必须出现在正确的列中（讲课行在"讲课"列打√，展示行在"其它"列打√）。√ 勾选格式正确且每行至少有1个√得满分；部分行缺少√或格式不规范得中分；所有排课行均无√勾选得 0 分。'
type = "binary"
weight = 10.0

[[criterion]]
id = "R29"
description = '讲课、习题/讨论、实验/上机、作业安排、辅导安排五列必须使用其中4个且分布合理：进度表正文表格排课行需在"讲课""习题/讨论""实验/上机""作业安排""辅导安排"五列中至少使用4个列（即至少4个列中有√标记或实际内容），且各列标记分布合理（非全部集中在单一列）。使用≥4个列且分布合理得满分；使用3个列得中分；使用≤2个列得 0 分。'
type = "binary"
weight = 3.0

[[criterion]]
id = "R30"
description = '小组展示行必须勾选为"其它"列：进度表正文表格中所有小组展示行（授课内容含"小组展示"或"展示"关键词的排课行）的"其它"列必须标记 √ 或含"展示"关键词，且"讲课""习题/讨论""实验/上机"等其它课程类型列不得同时标记 √。所有展示行"其它"列勾选√且无冲突勾选得满分；部分展示行未勾选"其它"列得中分；展示行全部未勾选"其它"列或勾选了错误的列得 0 分。'
type = "binary"
weight = 9.0

[[criterion]]
id = "R31"
description = '平时成绩必须由作业成绩和课堂表现两部分组成，且分布合理、含详细得分说明：文档中平时成绩考核方案需明确表述平时成绩由"课堂表现"和"作业成绩"两部分组成，并给出各部分占比（如各占50%）。同时需包含详细的得分说明：(1) 课堂表现部分需含基础分、加减分规则、违纪/缺勤扣分细则等具体评分标准；(2) 作业成绩部分需含作业次数、批改方式（如全批全改）、缺交处理（如缺交记为0分）等具体评分标准。两部分均有且含详细得分说明得满分；两部分有但缺少详细得分说明得中分；仅有一部分或两部分均无得 0 分。'
type = "binary"
weight = 10.0

[[criterion]]
id = "R33"
description = '交付文件中同一字段内容需前后保持一致：封面信息栏（段落区域）与进度表正文表格中段信息栏中出现的同一字段，其填写内容需逐字一致。需检查以下字段在两处出现时的内容一致性：(1) 授课学期（如封面"2025-2026学年第1学期"与进度表标题行中的学期表述需一致）；(2) 课程名称（封面课程名称与中段信息栏课程名称需逐字一致）；(3) 授课教师姓名（封面与中段信息栏需一致）；(4) 授课班级（封面与中段信息栏需一致，如封面"24数字经济（营销）1班"则中段不得仅写"数字经济（营销）1班"）。4 个字段全部一致得满分；3 个一致得中分；2 个一致得低分；≤1 个一致或无法比对得 0 分。'
type = "binary"
weight = 5.0

[scoring]
aggregation = "weighted_mean"
