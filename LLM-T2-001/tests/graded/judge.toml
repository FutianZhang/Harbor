[judge]
judge = "openai/gpt-5.6-luna"
files = [
  "/app/output/positions_eod.csv",
  "/app/output/valuation.csv",
  "/app/output/greeks.csv",
  "/app/output/pnl_attribution.csv",
  "/app/output/stress_report.json",
  "/app/output/validation_report.json",
  "/tests/golden_output/positions_eod.csv",
  "/tests/golden_output/valuation.csv",
  "/tests/golden_output/greeks.csv",
  "/tests/golden_output/pnl_attribution.csv",
  "/tests/golden_output/stress_report.json",
  "/tests/golden_output/validation_report.json",
]
mode = "individual"
timeout = 300

[[criterion]]
id = "R01"
description = "成功执行时交付六个规定名称的输出文件，失败执行时遵守公开错误交付边界；交付物可以被下游系统直接识别。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R02"
description = "positions_eod.csv 正确重建每个合约的期初数量、带方向交易净数量和期末数量，并覆盖无交易、平仓与反向持仓。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R03"
description = "valuation.csv 对 BTC/ETH European Call/Put 给出与公开输入及标准 Black-Scholes 约定一致的 t0/t1 单位价值，包括利率、精确到期时间和到期边界。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R04"
description = "valuation.csv 的单位与持仓 Delta、Gamma 在 Call/Put、不同价内外程度和长短仓下数值、符号及缩放均正确。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R05"
description = "valuation.csv 的 decimal-vol Vega 与 one-vol-point Vega 使用规定单位，二者关系及持仓和组合聚合结果一致。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R06"
description = "valuation.csv 的 annual Theta 与 daily Theta 使用规定的 calendar-forward 符号和精确 UTC ACT/365 时间，单位关系、持仓缩放及组合聚合正确。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R07"
description = "valuation.csv 的 Vanna、Volga 对混合 spot-vol 及波动率曲率敏感性给出正确单位值、持仓值和组合聚合。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R08"
description = "所有数量相关价值与 Greeks 从 metadata 读取 contract_multiplier，并与持仓方向和数量一致地缩放；greeks.csv 的组合聚合与逐合约结果一致。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R09"
description = "逐合约及组合实际 PnL 正确反映 t0/t1 市值、买卖方向、成交现金流、contract_multiplier 和 trade-total fees，并满足公开 accounting convention。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R10"
description = "pnl_attribution.csv 基于期初持仓与 t0 Greeks，按规定的 spot、vol 和时间变化计算 Delta、Gamma、Vega、Theta attribution，逐合约及组合结果正确。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R11"
description = "pnl_attribution.csv 按规定系数计算 Vanna、Volga attribution，并输出使 explained components 与 carry-position actual PnL 一致的非人为归零 residual。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R12"
description = "stress_report.json 对每个规定 scenario、underlying 和期末持仓执行 shocked spot/IV 的 full repricing，正确缩放并聚合，且按公开规则处理 invalid scenario。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R13"
description = "validation_report.json 及失败交付对 required schema、optional observations、duplicates、非有限值、语义有效性和输入顺序执行公开 validity rules，分类、定位、基数和规范化结果正确。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R14"
description = "全部 CSV/JSON 严格符合公开 output schema、行粒度和规范顺序，不含额外字段或非有限 JSON 数值；同一逻辑输入重复执行产生语义相同结果。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R15"
description = "交付物存在系统性 contract_multiplier 缩放缺陷，例如遗漏、重复应用或在价值、Greeks、PnL、attribution、stress 之间采用不一致缩放。"
type = "binary"
weight = 3.0
negate = true

[[criterion]]
id = "R16"
description = "交付物存在系统性 Greek 单位、符号或时间口径缺陷，例如 Vega 百倍偏差、Theta 时间方向错误或以整数 DTE 代替精确时间。"
type = "binary"
weight = 3.0
negate = true

[[criterion]]
id = "R17"
description = "交付物存在系统性 accounting 或 attribution 不一致，例如买卖现金流符号错误、忽略费用、组件口径不一致或强制 residual 为零。"
type = "binary"
weight = 3.0
negate = true

[[criterion]]
id = "R18"
description = "stress 结果以局部 Greek 近似替代规定的 full repricing，因而在非线性或 combined shock scenario 下产生系统性偏差。"
type = "binary"
weight = 3.0
negate = true

[scoring]
aggregation = "weighted_mean"
