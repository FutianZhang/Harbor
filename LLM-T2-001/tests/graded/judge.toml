[judge]
judge = "openai/gpt-5.6-luna"
files = [
  "/app/output/26.3.4 Nvidia CPO.docx",
  "/tests/golden_output/26.3.4 Nvidia CPO.docx",
]
mode = "individual"
timeout = 300



[[criterion]]
id = "R01"
description = "核心洞察凝练全文核心价值主张，完全覆盖以下三个层面中的每一个：(1)核心技术价值主张；(2)英伟达的竞争路径逻辑（须有完整的战略闭环表述）；(3)本次投资是生态建设的组成部分而非孤立事件。须含英伟达过往战略承接逻辑：此前GTC发布CPO交换机，被投公司作为核心供应商参与，本次投资是过往战略的自然延伸。仅泛泛复述投资事件背景而未点明竞争路径闭环逻辑或缺战略承接逻辑的判0分。"
type = "binary"
weight = 7.0


[[criterion]]
id = "R02"
description = "研究背景须准确交代投资事件全貌，以下四要素缺一不可：(1)时间；(2)金额：合计40亿美元，分别向两家被投公司各投入20亿美元；(3)对象；(4)技术方向。同时须交代签署多年期采购协议锁定产能这一关键条款。仅写\"签署采购协议\"而无具体说明的判0分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R03"
description = "投资主体概况须分别覆盖两家被投公司，每家均含核心业务概览、核心产品与技术（含具体产品类型及可量化参数）、与英伟达的合作三个子模块。合作宜覆盖以下方面：投资锁定产能、供应商地位、技术协同。两家公司差异化定位须有明确区分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R04"
description = "报告未交代投资背后的战略意图：缺少\"为何进行此项投资\"或\"该投资解决什么问题\"的分析，仅复述投资事实（金额、对象），无战略意图论述。触发此条件判不通过。"
type = "binary"
weight = 3.0
negate = true


[[criterion]]
id = "R05"
description = "报告未覆盖硅光子技术与 CPO 的关系，未说明硅光子作为 CPO 核心技术基础的作用。全文未提及硅光子技术，或虽提及但未将其与 CPO 建立关联。触发此条件判不通过。"
type = "binary"
weight = 3.0
negate = true


[[criterion]]
id = "R06"
description = "报告须列出CPO领域主要玩家（不少于4家），说明各自在CPO领域的角色定位。若全文仅提及英伟达和被投公司而无其他行业参与者则判0分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R07"
description = "参考文献未以 2025–2026 年信息为核心依据，以过时资料（2024 年及以前）作为主要参考来源，2024 年及以前来源占比超过 60%。触发此条件判不通过。"
type = "binary"
weight = 3.0
negate = true

[[criterion]]
id = "R08"
description = "参考资料来源数量须覆盖多类型来源：投资方与竞争对手官方页面、被投公司投资者关系页面、行业标准组织文档、芯片制造商官方技术资料等。参考文献中须包含公司官方技术博客URL，仅有官方产品页而无官方技术博客URL的判0分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R09"
description = "报告须包含CPO功耗相关技术数据，须包含可量化参数且数据须在论述上下文中自然呈现并有因果说明。脱离上下文的数据罗列判0分。"
type = "binary"
weight = 7.0


[[criterion]]
id = "R10"
description = "报告须对英伟达不同定位的CPO产品分别独立拆解，每款须包含核心参数（带宽、光学引擎配置、端口数量、功耗指标、支持集群规模等）。产品须有清晰定位区分。两款产品中须有至少一款包含冗余设计说明。产品参数缺失、未独立拆解、参数之间存在内部矛盾或缺冗余设计说明的判0分。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R11"
description = "报告须包含主要竞争对手的核心CPO产品参数，须说明该芯片可同时充当接入层和骨干层角色的灵活性。仅列端口参数而无双角色灵活性说明的判0分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R12"
description = "报告须从两个物理极限突破角度论证CPO核心驱动力：(1)端口密度优势解决铜缆物理极限；(2)电信号传输距离缩短，消除/降低信号调理器件功耗依赖，实现功耗降低。两个维度缺一判0分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R13"
description = "技术演进路径须完整呈现从可插拔→近封装→共封装→片上光学四阶段，各阶段从电信号传输距离、光学引擎可插拔性、集成度三维度对比。须覆盖至少一种CPO互补替代方案。缺互补替代方案说明的判0分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R14"
description = "报告须覆盖CPO光器件核心组件的技术路线对比（含调制器或光源中的至少一类），说明所选路线与封装方案的配套逻辑，而非孤立罗列参数。仅列参数表无路线选择逻辑论证的判0分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R15"
description = "光源策略分析缺少外置激光源工程考量的论证过程：仅给结论而无原因论证，或完全未说明行业采用外置激光源的工程理由（如散热、寿命、可维护性等）。触发此条件判不通过。"
type = "binary"
weight = 3.0
negate = true

[[criterion]]
id = "R16"
description = "工程挑战须包含可靠性悖论具体论证：须指出CPO虽减少整体组件数但存在单点故障导致整模块报废的风险，且维修更换难度高于传统可插拔方案，对制造良率有更高要求。须指出行业当前缺乏统一互操作性标准。仅提及\"CPO有工程挑战\"而无上述具体论证的判0分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R17"
description = "报告须对英伟达旗舰CPO交换机做多维度深度拆解，至少五个维度，每个维度须包含可量化参数。维度少于五个或任一维度无实际可量化内容则判0分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R18"
description = "产品roadmap须包含多个时间节点，须说明光学引擎带宽演进路径。仅列时间节点而无带宽演进说明的判0分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R19"
description = "万卡集群网络架构须完整推演：须说明交换芯片端口分配逻辑，无阻塞条件（上联带宽≥下联带宽）。须说明交换芯片同时充当接入层和骨干层角色的灵活性，以及各层拓扑关系。仅给端口参数而无双角色灵活性说明的判0分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R20"
description = "2-Tier架构须分多种链路速率场景完整推演，每种须有端口分配计算和计算节点总数推导步骤。仅给结论数字而无推导步骤的判0分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R21"
description = "3-Tier架构须完整推演POD规模和集群总数，须给出推导步骤。仅给结论数字而无推导步骤的判0分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R22"
description = "英伟达与主要竞争对手的竞争格局须从核心芯片、光引擎/光组件、先进封装与测试、整机/系统集成四个维度做生态对比。每个维度须列举具体合作伙伴或供应商名称。仅列维度标签无具体伙伴名称支撑的判0分。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R23"
description = "差异化结论须明确且含论证过程：须论证两种路线的竞争本质是不同生态策略之间的博弈。仅贴标签无博弈论证的判0分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R24"
description = "产业链生态版图须分层（至少三层以上）且每层列举不少于2家代表性企业，须说明每家企业核心技术定位。任一层少于2家或未说明技术定位的判0分。"
type = "binary"
weight = 3.0


[[criterion]]
id = "R25"
description = "核心封装技术须从多个层面逐步展开科普：是什么、核心机制、与传统方案对比、为什么是量产关键技术、产业分工等。须包含通俗类比解释。须说明设计与制造端和封装测试端的上下游互补关系。缺任一科普层面、无通俗解释、或缺上下游互补关系说明的判0分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R26"
description = "核心封装集成方案须有技术细节：须说明键合方式，须包含可量化对比数据（如间距缩减倍数、寄生参数降幅、密度提升倍数）。缺键合方式说明或缺可量化对比数据的判0分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R27"
description = "报告须论证特定供应商在多家客户中均为独家供应商的原因，须说明其技术壁垒。仅提及供应商名称而无技术壁垒论证的判0分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R28"
description = "全文逻辑链条须完整递进，完美路径为：投资事件→战略意义→技术原理→产品落地→竞争格局→未来趋势，各板块间须有逻辑承接而非孤立堆砌。缺逻辑承接或板块间断裂的判0分。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R29"
description = "从横向扩展到纵向扩展的战略范式转移须完整论证：(1)横向扩展是低风险切入点；(2)决胜关键在纵向扩展（GPU互联）。须覆盖多个GPU平台迭代（至少三代以上），须论证铜缆传输距离极限与光互连必然性。缺GPU互联战略价值论证或缺铜缆极限论证的判0分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R30"
description = "写作风格须专业但不干瘪，须使用类比和通俗解释降低理解门槛，让非光电专业投资人也能理解。纯学术语言堆砌无通俗解释的判0分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R31"
description = "docx文档排版须整洁规范：标题层级清晰（章/节/子节），正文段落有合理缩进或行距，便于读者导航定位。正文核心论述须以段落形式呈现，表格用于参数对比等结构化信息。各板块信息覆盖均衡。不得存在连续段落超过500字无任何分段或结构化元素的密集文字。若全文超过50%内容以表格单元格形式呈现而非段落论述则判0分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R32"
description = "正文有效字数须不少于10000字（不含表格内容、图片标注、参考文献列表），以段落论述形式呈现的正文内容须有足够的深度和广度覆盖报告主题。正文有效字数不足10000字则判0分。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R33"
description = "报告须包含不少于3个对比表格（如产品参数对比、技术路线对比、竞争格局对比等）用于结构化信息呈现，且须在正文中嵌入不少于10张图片/图示（包括但不限于架构图、拓扑图、技术路线图、产品实物图、数据图表等），每张图片和上下文具有关联性，而非无关图片插入。对比表格少于3个、图片少于10张、或任一图片与上下文无关的判0分。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R34"
description = "报告须包含至少一张清晰可辨的架构图（如CPO系统架构图、网络拓扑架构图、光电集成封装架构图、产业链生态架构图等），架构图须层次分明、标注清晰、逻辑关系可辨，使读者能通过架构图快速理解系统全貌或模块间关系。若全文无任何架构图或架构图模糊不可辨、逻辑混乱则判0分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R35"
description = "主要竞争对手的产业生态路线须覆盖完整：供应链策略（含具体供应商名称）、客户分层（含具体客户名称）。须有至少三个具体落地案例。案例少于三个的判0分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R36"
description = "英伟达CPO生态协同优势须论证：CPO产品与GPU集群深度协同的系统级优势，须含可量化对比数据。缺可量化对比数据的判0分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R37"
description = "正文须对段落重点有视觉强化处理，包括但不限于：关键论断使用加粗/高亮、核心数据使用下划线或着色、段落主题句使用小标题或行内标题。全文不得为无任何重点标记的纯平铺文本。若全文无任何重点视觉处理则判0分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R38"
description = "报告末尾未附参考资料来源列表，或参考文献中可点击的 URL 链接（http:// 或 https:// 开头）少于 8 条。触发此条件判不通过。"
type = "binary"
weight = 7.0
negate = true

[[criterion]]
id = "R39"
description = "参考文献主要为一手信息发布方（公司官方产品页、官方技术博客、官方新闻稿、SEC财报/公告、行业标准组织文档、芯片制造商官方技术资料等），二手转述来源在参考文献中占比小于30%。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R40"
description = "报告存在产品参数照搬官方新闻稿原文的问题：连续50字以上无改写、无分析整合、无横向对比；或产品定位差异缺少论证过程；或技术路线选择未说明选择逻辑与封装方案的配套关系。触发此条件判不通过。"
type = "binary"
weight = 7.0
negate = true

[[criterion]]
id = "R41"
description = "交付文件名不精确匹配\"26.3.4 Nvidia CPO.docx\"，包括存在多余前缀、后缀、错别字、大小写或扩展名不一致等情况。触发此条件判不通过。"
type = "binary"
weight = 3.0
negate = true


[[criterion]]
id = "R42"
description = "报告正文段落排布须合理，使用如章节标题、二级标题、三级标题或行内小标题清晰分隔不同主题，便于读者导航定位。"
type = "binary"
weight = 3.0
negate = true



[[criterion]]
id = "R43"
description = "报告对CPO在各场景的数据传输覆盖率有数据分析，至少覆盖3个应用场景，每个场景含百分比或速率提升倍数。无数据分析或场景不足3个的判0分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R44"
description = "报告以表格形式列出CPO产业链各环节核心供应商及其角色定位，供应商不少于5家且含英文名称。缺表格或供应商不足5家的判0分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R45"
description = "报告使用标准网络拓扑术语（Spine/Leaf/Fat-Tree/POD等）且在上下文中正确使用并解释含义，而非仅作标签。术语使用错误或无上下文解释的判0分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R46"
description = "报告列举不少于3个CPO具体落地案例，每个案例含可量化参数（部署规模/端口数/带宽等）。案例不足3个或任一案例无可量化参数的判0分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R47"
description = "2-Tier和3-Tier架构推演列出完整数学推导步骤（含端口分配公式或等式），而非仅给结论数字。无推导步骤的判0分。"
type = "binary"
weight = 7.0

[scoring]
aggregation = "weighted_mean"
