[judge]
judge = "openai/gpt-5.6-luna"
files = [
  "/app/output/CYB-T8-014_ISO27001与等保差距评估报告.pdf",
  "/app/output/CYB-T8-014_合规检查与证据矩阵.xlsx",
]
mode = "individual"
timeout = 300
reference = "/tests/golden_output"

[[criterion]]
id = "R1"
description = "按instruction规定的文件名、数量和格式提交全部交付物，且PDF/XLSX/CSV均可解析。 必须严格按 task.toml 清单逐字提供 required 文件。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R2"
description = "未同时出现本任务全部官方发现编号与规定状态字面量时，本项必须判否。管理层摘要能够独立说明核心风险、业务影响、处置优先级和当前决策门禁。 可核对锚点：CMP-001、P0、管理层摘要、业务影响。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R3"
description = "不得因行文专业、结构完整或使用自造编号（如 F-01）而给分。准确呈现并关联官方发现编号（禁止用自造 F-01/F-02 等替代）：CMP-001、CMP-002、CMP-003、CMP-004、CMP-005；每个 ID 必须与规定状态同时可核对。 可核对锚点：CMP-001、CMP-002、CMP-003、CMP-004、CMP-005。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R4"
description = "不得因行文专业、结构完整或使用自造编号（如 F-01）而给分。风险等级/状态必须使用规定字面量，不得用 High/Medium/待复核 等近义改写替代：不符合/高、不符合/中、证据不足/待复核、改进项/不计入基准缺口、不适用/有范围理由，且说明判断依据。 可核对锚点：不符合/高、不符合/中、证据不足/待复核、改进项/不计入基准缺口、不适用/有范围理由。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R5"
description = "未同时出现本任务全部官方发现编号与规定状态字面量时，本项必须判否。识别完整攻击链、证据链、控制链或治理链，而非只罗列单点扫描/告警/控制。 可核对锚点：CMP-E02、CMP-E03、CMP-E01、CMP-E04、01 scope。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R6"
description = "修复与处置建议可实施，并使用任务规定责任主体字面量：IAM平台主管、身份治理组、审计与云安全组、云平台主管，含回滚。 可核对锚点：IAM平台主管、身份治理组、审计与云安全组、云平台主管、回滚。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R7"
description = "未同时出现本任务全部官方发现编号与规定状态字面量时，本项必须判否。逐项说明业务影响，并避免把技术严重度直接等同于业务优先级。 可核对锚点：业务影响、业务优先级。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R8"
description = "未同时出现本任务全部官方发现编号与规定状态字面量时，本项必须判否。每项关键建议包含验证方法、回滚方案和恢复/关闭门禁。 可核对锚点：验证方式、回滚方案、恢复门禁。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R9"
description = "未同时出现本任务全部官方发现编号与规定状态字面量时，本项必须判否。空产物或仅有套话一律判否。正确对齐本任务适用的CVSS、ATT&CK、ISO/等保或零信任控制语境，且不超出冻结材料；必须同时出现官方发现编号 CMP-001、CMP-002、CMP-003、CMP-004、CMP-005 与规定状态字面量，不得仅写框架名称套话。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R10"
description = "未同时出现本任务全部官方发现编号与规定状态字面量时，本项必须判否。空产物或仅有套话一律判否。明确表达证据边界与不确定性：Prowler样例中root条目的结果和扩展说明冲突，只能判为证据不足；本任务使用自编短摘要，不替代ISO标准正版或GB/T 22239-2019完整正文和正式测评。 可核对锚点：不确定性、证据边界。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R11"
description = "未同时出现本任务全部官方发现编号与规定状态字面量时，本项必须判否。覆盖全部必要输入，并能说明各文件在范围、事实、约束或复核中的作用。 可核对锚点：00_数据来源与脱敏说明.json、01_评估范围与法律边界.md、02_Prowler公开样例.csv、03_Prowler公开样例.json、04_Prowler_ASFF公开样例.json、05_标准官方登记与版本.json、06_合法控制摘要与映射.csv、07_业务与整改约束.md、08_五态判定规则.md、09_证据索引.csv。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R12"
description = "未同时出现本任务全部官方发现编号与规定状态字面量时，本项必须判否。关键结论均带可回到输入文件、记录ID、事件ID或控制ID的证据定位。 必须出现可回溯的输入记录/证据 ID，而不是只写结论。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R13"
description = "未同时出现本任务全部官方发现编号与规定状态字面量时，本项必须判否。优先级体现风险、暴露/可达性、资产价值和业务约束，而非机械排序。 可核对锚点：优先级、资产价值、业务约束。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R14"
description = "整改计划包含责任主体、完成时限和复核责任，责任主体应能对应：IAM平台主管、身份治理组、审计与云安全组、云平台主管。 可核对锚点：责任主体、完成时限、复核。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R15"
description = "未同时出现本任务全部官方发现编号与规定状态字面量时，本项必须判否。提供P0/P1/P2或等价的分阶段路线图，并定义阶段退出条件，覆盖长程多轮复核门禁。 可核对锚点：P0、P1、P2、阶段退出、分阶段路线图。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R16"
description = "未同时出现本任务全部官方发现编号与规定状态字面量时，本项必须判否。空产物或仅有套话一律判否。交付物必须明确写出仅本地/离线/禁止访问公网的分析边界，并与官方发现编号 CMP-001、CMP-002、CMP-003、CMP-004、CMP-005 绑定；不得因“未发现攻击步骤”而给分。可核对锚点：仅本地、离线、禁止访问公网、CMP-001、CMP-002、CMP-003、CMP-004、CMP-005。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R17"
description = "未同时出现本任务全部官方发现编号与规定状态字面量时，本项必须判否。PDF结构完整，包含摘要、范围方法、证据链、风险、方案、验证回滚、路线图、局限和证据索引。 可核对锚点：管理层摘要、范围、方法与安全边界、事实与证据链、风险与业务影响、优先级与处置方案、验证、回滚与恢复门禁、分阶段路线图、限制、不确定性与后续复核、证据索引。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R18"
description = "结构化交付物包含可筛选核心清单，且工作表名齐全：管理摘要、控制检查清单、证据矩阵、整改路线图；含状态、责任、时限、证据、验证和回滚字段。 可核对锚点：管理摘要、控制检查清单、证据矩阵、整改路线图。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R19"
description = "PDF与表格排版专业、克制、清晰，无明显遮挡、溢出、难辨字号或损坏文件。 PDF 至少 9 页且文本可检索。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R20"
description = "不得因行文专业、结构完整或使用自造编号（如 F-01）而给分。PDF与结构化表中的官方 ID、规定状态字面量、责任和时限相互一致；缺少任一官方 ID 或把状态改写成近义词不得给分。 可核对锚点：CMP-001、CMP-002、CMP-003、CMP-004、CMP-005；不符合/高、不符合/中、证据不足/待复核、改进项/不计入基准缺口、不适用/有范围理由。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R21"
description = "未同时出现本任务全部官方发现编号与规定状态字面量时，本项必须判否。XLSX/CSV保持可编辑、可筛选，关键汇总由公式或可追溯字段驱动。 文件必须可解析、可编辑或可筛选。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R22"
description = "未同时出现本任务全部官方发现编号与规定状态字面量时，本项必须判否。主动披露局限、冻结日期、待验证事项和专家复核要求。 可核对锚点：局限、2026-07-27、待复核、专家审核。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R23"
description = "不得因行文专业、结构完整或使用自造编号（如 F-01）而给分。必须使用本任务官方发现编号与特有证据锚点，不以空泛模板或自造编号替代。 可核对锚点：CMP-001、CMP-002、CMP-003、CMP-004、CMP-005、TITLE_ID、Not Scored、example_user、ISO-A.5.18、证据不足/待复核。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R24"
description = "仅给出结论或建议，缺少必要证据、记录ID或可复核支撑时扣分。 候选必须包含充分篇幅和至少 8 个可回溯证据标识。 该项仅在交付物中确实出现该错误时判为违规。"
type = "binary"
negate = true
weight = 7.0

[[criterion]]
id = "R25"
description = "候选缺少任意一项必交文件，或把文件写成清单外的近似名称。"
type = "binary"
negate = true
weight = 7.0

[[criterion]]
id = "R26"
description = "候选关键结论没有输入文件名、记录 ID、事件 ID、控制 ID 或路径 ID 支撑。"
type = "binary"
negate = true
weight = 7.0

[[criterion]]
id = "R27"
description = "候选仅按 CVSS、单一告警分数或文件路径机械排序，忽略暴露、资产价值或业务约束。"
type = "binary"
negate = true
weight = 3.0

[[criterion]]
id = "R28"
description = "候选把验证、回滚或恢复门禁写成泛化口号，未给出与具体治理项对应的退出条件。"
type = "binary"
negate = true
weight = 3.0

[scoring]
aggregation = "weighted_mean"
