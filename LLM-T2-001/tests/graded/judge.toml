[judge]
judge = "openai/gpt-5.5"
files = [
  "/app/output/report.html",
  "/app/output/report.pdf",
  "/tests/golden_output/report.html",
  "/tests/golden_output/report.pdf",
]
mode = "batched"
timeout = 300

[[criterion]]
id = "R01"
description = "报告须明确覆盖以下四大核心需求主题（全部出现）：(1) 私有化部署/本地部署；(2) AI Agent/MCP/Skill 全链路日志溯源/全链路追踪；(3) 日志数据本地存储/禁止外发/数据不出域；(4) 后期拓展模型评估能力/模型评测。缺少任一主题即判 0。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R02"
description = "交付物须同时包含 HTML 和 PDF 两种格式的文件，且各文件内容无实质差异。源码及 PDF 中不得出现任何本地文件路径信息（如操作系统路径、临时目录等）。缺少任一文件、内容不一致、或出现任何本地路径即判 0。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R03"
description = "报告须引用不少于 6 个不同外部信息来源域名，且须同时包含 LangFuse 官方域名和 AgentLoop/阿里云文档域名。信息来源不限于原始附件，须有外网补充评测/行业分析内容。域名数不足 6 或缺少任一官方文档域名即判 0。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R04"
description = "报告须完整包含以下 9 大模块且顺序正确：(1) 报告摘要；(2) 产品架构与功能模块；(3) 设计差异与优劣分析；(4) 产品可扩展性分析；(5) 全链路追踪功能交互分析；(6) 团队适配分析；(7) 成本分析与数据安全分析；(8) 选型建议；(9) 分阶段实施计划。缺模块或顺序错乱即判 0。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R05"
description = "报告中所有分析、结论、功能描述均须附有可点击的信息来源链接，且链接总数不少于 20 个，须分布在报告的前、中、后三个部分（每部分至少 1 个链接）。链接总数不足 20 或任一部分无链接即判 0。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R06"
description = "报告中须明确提及\"模型评估\"或\"模型评测\"这一完整概念（作为独立的能力方向出现），仅在普通上下文中零散出现\"评估\"二字不满足要求。未提及该概念即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R07"
description = "报告 9 大模块中每个模块须包含至少 8 个不同的外部信息来源链接（同一 URL 重复出现只计 1 次）。9 个模块分别检查，任一模块的去重后外链数不足 8 个即判 0。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R08"
description = "报告中核心产品能力、架构特性、功能差异的论述须基于官方文档，无编造及逻辑错误。功能模块对比内容须逐项附有对应的信息来源。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R09"
description = "报告须深度适配实际业务场景，所有适配分析、成本评估、选型论证均贴合内部实际场景而非通用套话。须明确覆盖团队规模、产品线数量、核心业务模式、团队配置与投入成本、部署场景对数据主权与合规的影响等全部关键维度，每个维度须有具体数字支撑而非笼统定性。缺少任一维度、或维度中未与具体数字关联即判 0。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R10"
description = "报告须包含核心对比维度且两款产品优劣对比维度均衡、无偏袒。报告中须包含产品的产品截图或界面示意图。缺少关键对比维度或缺少产品截图即判 0。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R11"
description = "各项对比评分及论点须符合逻辑，客观公平，无绝对性言论。报告须包含不少于 5 项量化客观对比指标（如功能评分表、维度雷达图、权重对比等），支撑论点的客观性和公正性。出现绝对性言论或客观性指标不足 5 项即判 0。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R12"
description = "报告模块内容须饱满，架构描述、差异分析、扩展性、交互逻辑、团队适配、成本安全、选型建议须形成完整逻辑闭环，无内容空洞、半截论述。中文字数不少于 4000 字，可视化元素（图表、图片、对比表等）不少于 14 个。字数或可视化元素不达标即判 0。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R13"
description = "报告须精准区分产品的核心差异：开源特性与二次开发优势、企业级特性与数据飞轮优势等，须明确提及这些差异点并给出准确分析。未提及或描述错误即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R14"
description = "报告须完整落地架构图、评分图、对比表等可视化组件，数据和图表须适配。矢量图表（SVG）不少于 5 个，图片不少于 1 张。数量不达标即判 0。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R15"
description = "文本须精简分段合理，核心结论高亮突出（高亮信息框不少于 4 个），表格数据规整（表格不少于 3 个），无长段文字墙，图表简洁易懂。高亮元素、表格数量不达标或存在大段无排版文字即判 0。"
type = "binary"
weight = 3.0


[[criterion]]
id = "R16"
description = "报告内容存在明显模板化痕迹，如大段复制通用竞品分析模板文字而未结合实际产品特性进行定制化分析。出现任一处即判违规。"
type = "binary"
negate = true
weight = 3.0


[[criterion]]
id = "R17"
description = "信息来源链接须在视觉上与正文有明显区分，读者能快速辨识哪些是引用来源、哪些是正文分析。须同时满足：(1) 来源链接有独立的视觉样式（如点状下划线、不同颜色等）；(2) 来源链接字号明显小于正文；(3) 来源链接整体样式与正文形成清晰反差。缺少任一项即判 0。"
type = "binary"
negate = true
weight = 3.0

[[criterion]]
id = "R18"
description = "选型建议模块须通过差异化的视觉设计清晰区分推荐方案与备选方案（如不同的边框色、背景色、标签等），让读者一眼辨别方案优先级。无差异化视觉设计即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R19"
description = "全链路追踪交互流程须以矢量图形组件呈现步骤间的顺序关系，步骤间有明确的箭头或连接符指示流向。仅使用纯文字箭头（如\"→\"字符）或普通排版排列不满足要求，必须包含矢量图形绘制的流程图。无矢量流程图组件即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R20"
description = "关键结论须通过独立的高亮信息框组件突出展示，而非仅依赖加粗文字。高亮信息框不少于 4 个，少于 4 个或仅用加粗标记即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R21"
description = "报告须有独立封面页（非直接从正文开始），封面页须包含报告主标题、副标题或一句话定位描述、以及元信息区域（含编制部门、版本号、密级、用途、日期等至少 2 项）。缺少封面页或封面页缺少任一要素即判 0。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R22"
description = "报告中须包含至少 2 张产品截图或界面示意图，且所有图片须配有文字说明（含图片编号和内容描述）。完全无图片或裸贴图片无文字说明即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R23"
description = "报告 9 大模块（不含封面和页脚）中每个模块结尾须有独立的结构化小结框（可根据高亮区域识别），对本模块核心结论进行总结归纳。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R24"
description = "报告摘要模块须包含决策方向摘要，即在正文展开前先给出核心结论和分阶段方向（如短期/中期/远期各做什么），让读者快速获取决策要点。仅有概述性文字而无明确结论或分阶段方向即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R25"
description = "报告中的所有图表（矢量图表、图片等可视化元素）须有统一的编号标题（如\"图1：…\"\"图2：…\"）。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R26"
description = "选型建议模块须同时包含推荐方案和备选方案，且须为每个方案给出明确的引入时机和前置条件。仅有单一方案、或任一方案缺少具体的引入时机和前置条件即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R27"
description = "报告须有独立的分阶段实施计划章节，其中每个阶段须包含三段式结构：(1) 阶段目标；(2) 分工安排（各角色具体任务）；(3) 交付物/验收标准。三段式中缺少任一段、或缺少汇总表格将各阶段结构化呈现即判 0。仅在报告其他部分偶发性出现阶段相关描述不满足要求。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R28"
description = "成本分析须从不少于 4 个维度展开结构化对比（如许可费用、基础设施、人力投入、运维成本等），每个维度须给出具体金额或金额范围，而非仅给出笼统的定性描述。对比维度不足 4 个、或任一维度缺少具体金额即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R29"
description = "报告须为每款产品绘制独立架构图，分别展示该产品自身的分层/模块结构，不能仅做两张产品合并到同一图中的对比图。缺少任一款产品的独立架构图即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R30"
description = "对比表格中须包含将产品能力差异与实际业务场景关联的分析维度（如\"场景适配\"\"团队适配\"等），而非仅做纯功能罗列。对比表格无场景关联分析即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R31"
description = "选型建议模块中每个方案须附具体理由，理由须指向实际场景（如成本、团队、技术栈等），不能是一段笼统文字。任一方案无理由或理由过于笼统即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R32"
description = "数据安全分析须从不少于 5 个安全维度展开结构化对比（如数据存储、传输加密、访问控制、审计日志、合规风险、数据主权等），每个维度须给出两款产品的具体差异描述（而非仅标注\"支持/不支持\"），并须包含该维度对公司私有化部署要求的适配性分析。安全维度不足 5 个、或任一维度缺少差异描述和适配性分析即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R33"
description = "成本分析模块须包含可视化图表（如柱状图、对比条形图等），将成本对比以图形方式直观呈现，不能仅有表格而无图表。缺少成本可视化图表即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R34"
description = "PDF 须具备分页意识：标题与紧随其后的内容不应被分页符隔开（即标题单独出现在页尾、内容在下一页）；图表、表格不应被分页符截断（跨页断开）。出现标题与内容跨页、或表格/图片被分页截断即判 0。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R35"
description = "PDF 须具备排版意识：(1) 单页留白面积不超过页面可排版区域的 30%；(2) 须设置分页控制样式，确保标题不与后续内容跨页分离；(3) 须设置分页控制样式，确保图表、表格等元素不被分页截断。缺少任一排版控制或存在大面积留白页即判 0。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R36"
description = "报告中须包含至少 1 张产品截图或界面示意图，且图片文件须正确引用，确保生成 PDF 时图片能被正确嵌入。完全无图片、或图片缺失/路径错误导致 PDF 中无法显示即判 0。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R37"
description = "对比分析中须包含功能版本/版本号维度的对比（如开源版与企业版的功能差异、公测与 GA 阶段差异等），而非仅做整体产品级对比。缺少版本维度对比即判 0。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R38"
description = "报告须使用规范的标题层级结构：顶级标题仅 1 个用于报告主标题，二级标题不少于 9 个对应 9 大模块，三级标题用于模块内子节。标题层级不完整、层次缺失或数量不达标即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R39"
description = "报告中所有外链须去重后统计，同一 URL 在不同位置重复出现只计 1 次。去重后不同 URL 的数量须不少于 15 个（非去重总数须不少于 20 个）。去重后不同 URL 数量不足 15 个即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R40"
description = "报告 9 大模块中信息来源链接分布须均衡：将报告按内容长度等分为前、中、后三段，每段中不同来源域名的链接数量均须不少于 2 个。任一段的去重后域名链接数不足 2 个即判 0。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R41"
description = "报告须深度融入实际业务场景，覆盖团队规模、产品线数量、业务模式、团队配置、部署场景、核心功能场景、跨产品线方案、后期拓展评估、具体选型建议、分阶段实施计划等定制化要素。覆盖 8 项以上判满分，每少 1 项扣 1 分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R42"
description = "报告中出现通用对比模板套话，如\"综上所述\"重复出现、\"仅供参考\"\"如有疑问请联系\"\"版权所有侵权必究\"\"免责声明\"等模板化表述。出现任一套话即判违规。"
type = "binary"
negate = true
weight = 3.0

[[criterion]]
id = "R43"
description = "报告省略核心模块（9 大模块中缺少任一）、简化对比维度、或缺失图表素材（矢量图表不足 5 个或图片不足 1 张）。存在省略或简化即判违规。"
type = "binary"
negate = true
weight = 7.0

[[criterion]]
id = "R44"
description = "报告中存在空白区域或未完成的内容占位（如空容器、缺失内容、布局未完成的区域），说明部分内容缺失。"
type = "binary"
negate = true
weight = 3.0

[[criterion]]
id = "R45"
description = "对比表格使用通用默认样式，表头和单元格未与报告整体视觉风格融合定制。"
type = "binary"
negate = true
weight = 3.0

[[criterion]]
id = "R46"
description = "团队适配分析以独立卡片堆叠方式呈现角色信息，各角色卡片之间无协同关系或联动设计的视觉表达。"
type = "binary"
negate = true
weight = 3.0

[[criterion]]
id = "R47"
description = "条目编号设计使用通用样式，未与报告主题风格统一定制。"
type = "binary"
negate = true
weight = 3.0

[[criterion]]
id = "R48"
description = "PDF 文件中出现大面积留白（单页留白超过页面可排版区域的 30%），或标题与内容被分页符隔开、图表被分页截断等排版问题。存在任一排版问题即判违规。"
type = "binary"
negate = true
weight = 3.0

[[criterion]]
id = "R49"
description = "报告中出现与输入文件中产品手册截图不符的编造功能、篡改的产品特性描述、或虚构的性能指标数据。出现任一处即判违规。"
type = "binary"
negate = true
weight = 3.0



[scoring]
aggregation = "weighted_mean"
