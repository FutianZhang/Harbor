[judge]
judge = "openai/gpt-5.6-luna"
files = ["/app/output/《中国东盟营销环境与策略》教学进度表.docx"]
mode = "individual"

[[criterion]]
id = "R01"
description = "交付物为有效的 .docx 文件，且能正常解析出段落与表格结构。文件损坏或无法解析得 0 分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R02"
description = "基于模板原件填充而非新建文档。判定标准：文档保留了模板原有的结构框架（教学日志封面、教学计划进度表、教材与参考书目、说明及平时成绩考核方案等完整模块），并在相应字段中填充了学期、课程、教师、班级和教学安排等内容，未发现明显另起炉灶的新建文档痕迹，即视为基于模板填充，得满分。如能提供模板原件进行内部比对且匹配率达 100% 得满分；结构部分缺失得中分（0.5）；完全新建文档得 0 分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R03"
description = "进度表正文表头需与模板表头逐字一致：表头 11 列需依次为\"周次/星期/节次/授课内容/讲课/习题讨论/实验上机/作业安排/辅导安排/其它/执行情况\"，列数和列顺序均需匹配。仅空格、斜杠、全角/半角等排版字符差异不视为错误。 列名文字内容完全对应（忽略空白字符）得满分；缺列或列名错误 ≤2 处得中分；缺列或列名错误 ≥3 处得 0 分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R06"
description = "合理解决学时矛盾：进度表需出现至少 2 处相邻单元合并（如\"老挝+缅甸\"、\"新加坡+文莱\"在授课内容列同框出现），并包含\"小组展示\"主题；大纲 10个国家主题需全部出现。无合并且知识点有遗漏得 0 分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R07"
description = "输出进行校验：需出现\"校验\"\"合计\"\"总计\"\"总学时\"\"共32学时\"等校验性表述，或进度表所有排课行节次数累加等于大纲课内总学时 32。无校验且总数不等于 32 得 0 分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R19"
description = "封面信息栏字段需与输入文件（教师课表、校历、大纲）逐个校验保持一致。检查以下 5 个字段：(1) 授课学期为\"2025-2026学年第1学期\"；(2) 课程名称含\"中国东盟营销环境与策略\"；(3) 授课教师姓名需与教师课表中标注的教师姓名一致（如\"李林\"）；(4) 授课班级需与课表中的教学班组成一致（如含\"24数字经济（营销）1班\"）；(5) 开课部门/所属部门需填写实际内容（非空白）。命中 ≥5 项得满分；4 项得中分；3 项得低分；<3 项得 0 分。"
type = "binary"
weight = 5.0

[[criterion]]
id = "R19B"
description = "进度表正文表格中段信息栏字段需与输入文件保持一致。检查以下 3 个字段：(1) 中段信息栏的课程名称行需与输入课程名称一致；(2) 中段信息栏的授课班级行需与输入班级一致；(3) 中段信息栏的教研室签字行需填写实际内容（非空白）。3 项全命中得满分；2 项得中分；1 项得低分；全未命中得 0 分。"
type = "binary"
weight = 5.0

[[criterion]]
id = "R25"
description = "联系电话需填写实际号码：进度表中段信息栏\"联系电话：\"冒号后需跟实际电话号码（数字或含连字符/括号的号码格式，非空白、非模板占位符如\"XX\"或\"XXX\"）。填写实际号码得满分；留空白或保留模板占位符得 0 分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R03"
description = "授课内容引用大纲原文且使用规范编号格式：进度表授课内容列需逐字引用大纲原文的教学单元标题（不得篡改或自拟标题），且使用\"第N讲\"编号格式至少出现 10 处。\"第N讲\"格式 ≥10 处且内容源自大纲得满分；≥7 处得中分；≥4 处得低分；<4 处或出现大纲中不存在的自拟单元标题得 0 分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R10"
description = "排课行周次整体需按升序排列（除第5周节假日跳过），不要求同一周内排课行按星期升序排列；星期格式为中文一/二/三/四/五/六/日；节次列取值种类 ≤3 种；周次跨度 =8 周。以上 4 个子条件全部满足得满分；否则得 0 分。"
type = "binary"
weight = 9.0

[[criterion]]
id = "R11"
description = "正确跳过节假日周次：进度表周次列需出现至少 1 处跳号（gap>=1，如从第4周跳到第6周），表明已跳过国庆假期。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R12"
description = "进度表所有排课行的节次数累加等于大纲课内总学时 32。节次列格式接受\"3-4\"（表示第3-4节，2学时）或\"1-4\"（表示4节）等常见写法，只要每行节次数可明确计算且累加等于 32 即可。累加等于 32 且格式规范得满分；否则 得 0 分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R13"
description = "理论课时与实践课时需符合大纲：进度表正文表格\"讲课\"列标记 √ 的节次累加为理论学时，\"实验上机\"列标记 √ 的节次累加为实践学时，\"其他\"列标记的节次为其他类，如小组展示。大纲要求 24 理论 0 实践 8 其他。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R14"
description = "平时成绩考核方案需包含两个标题段落：(1) 文档中需出现\"课堂表现\"标题或段落标识（如\"课堂表现：\"、\"课堂表现部分\"）；(2) 需出现\"作业成绩\"标题或段落标识（如\"作业成绩：\"、\"作业成绩部分\"）。同时需明确表述平时成绩由这两部分组成。两部分标题均有且表述完整得满分；仅有 1 个标题得0分；均无或无考核方案段得 0 分。"
type = "binary"
weight = 9.0

[[criterion]]
id = "R15"
description = "封面信息完整填写：以下 7 个字段需全部填写且冒号后跟实际内容（非空白）：授课学期、教研室、授课教师、授课班级、课程名称、开课部门、日期。日期需为\"20XX年X月X日\"或\"20XX.X.X\"等常见日期格式，含多余空格但能明确识别为有效日期的视为填写有效。7 项全部填写得满分，否则得0分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R16"
description = "进度表正文表格的\"使用教材\"行需填写书名+出版社（\"出版社\"或\"出版\"关键词需出现），\"参考书目\"行需列出至少 2 本参考书（按 1、2、3 编号计数）。教材完整且参考书 ≥2 本得满分；教材无出版社或参考书仅 1 本得中分；仅有教材或仅有参考书得低分；两者皆无得 0 分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R20"
description = "讲课课时与学生展示课时比例为 24:8：进度表正文表格\"讲课\"列标记 √ 的排课行节次累加需等于 24（讲课学时），\"其它\"列含\"展示\"\"√\"\"学生展示\"等标记的排课行节次累加需等于 8（展示学时）。讲课=24 且展示=8 得满分；其余不符得 0 分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R22"
description = "学生展示主题需符合课程含义、包含案例分析、4 个主题存在差异：(1) 四个主题需不同。；(2) 至少 2 个主题含\"案例分析\"关键词；(3) 至少 4个主题含课程相关关键词（东盟/东南亚/营销/市场/泰国/马来西亚/新加坡/印尼/菲律宾/文莱/越南/柬埔寨/老挝/缅甸）。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R24"
description = "课程类型需正确勾选：前 24 课时（讲课行）的\"讲课\"列需标记 √，后 8 课时（学生展示行）的\"其它\"列需标记 √或含\"展示\"关键词，且讲课行在前、展示行在后（展示行不能出现在讲课行之前）。讲课 √ 行课时=24、展示行课时=8 且顺序正确得满分；课时正确但顺序错误得中分；课时不正确得 0 分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R28"
description = "课程类型/内容勾选栏必须有 √ 勾选且符合文件要求格式：进度表正文表格的\"讲课\"\"习题/讨论\"\"实验/上机\"\"作业安排\"\"辅导安排\"\"其它\"六列中，排课行需使用 √ 标记对应课程类型，√ 必须出现在正确的列中（讲课行在\"讲课\"列打√，展示行在\"其它\"列打√）。√ 勾选格式正确且每行至少有1个√得满分；部分行缺少√或格式不规范得中分；所有排课行均无√勾选得 0 分。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R29"
description = "讲课、习题/讨论、实验/上机、作业安排、辅导安排五列必须使用其中4个且分布合理：进度表正文表格排课行需在\"讲课\"\"习题/讨论\"\"实验/上机\"\"作业安排\"\"辅导安排\"五列中至少使用4个列（即至少4个列中有√标记或实际内容），且各列标记分布合理（非全部集中在单一列）。使用≥4个列且分布合理得满分；使用3个列得中分；使用≤2个列得 0 分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R30"
description = "小组展示行必须勾选为\"其它\"列：进度表正文表格中所有小组展示行（授课内容含\"小组展示\"或\"展示\"关键词的排课行）的\"其它\"列必须标记 √ 或含\"展示\"关键词，且\"讲课\"\"习题/讨论\"\"实验/上机\"等其它课程类型列不得同时标记 √。所有展示行\"其它\"列勾选√且无冲突勾选得满分；部分展示行未勾选\"其它\"列得中分；展示行全部未勾选\"其它\"列或勾选了错误的列得 0 分。"
type = "binary"
weight = 9.0

[[criterion]]
id = "R31"
description = "平时成绩必须由作业成绩和课堂表现两部分组成，且分布合理、含详细得分说明：文档中平时成绩考核方案需明确表述平时成绩由\"课堂表现\"和\"作业成绩\"两部分组成，并给出各部分占比（如各占50%）。同时需包含详细的得分说明：(1) 课堂表现部分需含基础分、加减分规则、违纪/缺勤扣分细则等具体评分标准；(2) 作业成绩部分需含作业次数、批改方式（如全批全改）、缺交处理（如缺交记为0分）等具体评分标准。两部分均有且含详细得分说明得满分；两部分有但缺少详细得分说明得中分；仅有一部分或两部分均无得 0 分。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R33"
description = "交付文件中同一字段内容需前后保持一致：封面信息栏（段落区域）与进度表正文表格中段信息栏中出现的同一字段，其填写内容需逐字一致。需检查以下字段在两处出现时的内容一致性：(1) 授课学期（如封面\"2025-2026学年第1学期\"与进度表标题行中的学期表述需一致）；(2) 课程名称（封面课程名称与中段信息栏课程名称需逐字一致）；(3) 授课教师姓名（封面与中段信息栏需一致）；(4) 授课班级（封面与中段信息栏需一致，如封面\"24数字经济（营销）1班\"则中段不得仅写\"数字经济（营销）1班\"）"
type = "binary"
weight = 5.0

[[criterion]]
id = "R08"
description = "小组展示不得出现\"实训基地/实习企业\"等捏造实践场所、不得出现\"外部专家/邀请讲座\"等捏造人员以及‘社会实践’，此类在输入文件中均为提及的情况。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R05"
description = "（1）课程内容周次编排疏密均衡，允许最后 2 周安排小组展示而无需同时安排课程内容；除最后 2 周的展示周和节假日跳过的周次外，其余每周需有课程内容。（2）上课周次数为 8 周。（3）上课内容须有 24 个课时，小组展示为 8 个课时。3 项全部满足得满分；否则得 0 分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R09"
description = "数据行全部填写真实内容：进度表正文表格中段（表头与教材参考书目行之间）不得出现完全空白的数据行（所有单元格均无内容）。出现则得0 分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R17"
description = "进度表正文中段信息栏需填写完整：课程名称行（\"课程名称：\"后跟实际课程名）、授课班级行（\"授课班级：\"后跟实际班级）、教研室签字行（含\"教研室主任\"或\"签字\"或\"负责人\"关键词）三行均需有实际内容（非模板占位空白）。三行全填得满分；填 2 行得中分；填 1 行得低分；全未填得 0 分。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R26"
description = "小组展示主题方向需与课程主题一致：课程主题为\"中国-东盟营销环境分析与策略\"，教学单元为各国市场营销（课程讨论国家列表：泰国/马来西亚/新加坡/文莱/印尼/菲律宾/越南/柬埔寨/老挝/缅甸）。展示主题需聚焦于分析东盟当地企业的营销案例或该国本土化营销策略，而非中国企业出海/进入该国市场的策略。4 个展示主题中：(1)聚焦当地企业或当地市场环境分析（含\"当地\"\"本土\"\"该国\"\"东盟\"等关键词）；(2) 主题不可偏移为中国企业出海视角（\"中国XX产品进入XX市场\"\"中国XX品牌进入\"等表述视为偏移）。不满足条件（1）或触发条件(2）存在任意一个主题偏移得 0 分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R34"
description = "模板占位符未替换：文档中出现\"XXXX\"、\"XX\"、\"待定\"、\"未填写\"、\"请填写\"、\"【】\"等模板占位符或空白提示文字，填写规范类可以保留（如“请打√表示”），其余出现任一处即判违规。"
type = "binary"
negate = true
weight = 3.0

[[criterion]]
id = "R35"
description = "格式破坏：表格断裂、文字重叠、段落格式混乱、页边距异常等影响阅读体验的排版问题。出现任一处即判违规。"
type = "binary"
negate = true
weight = 3.0

[[criterion]]
id = "R36"
description = "出现输入文件中不存在的课程名称、教师姓名、班级名称、开课部门等信息（如教师姓名不是课表中的真实教师、班级名称与课表不符等）。出现任一处即判违规。"
type = "binary"
negate = true
weight = 5.0

[scoring]
aggregation = "weighted_mean"
