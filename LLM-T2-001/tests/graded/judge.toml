[judge]
judge = "openai/gpt-5.6-luna"
files = [
  "/app/output/台农芒果采后糖处理实验分析.pptx",
  "/tests/golden_output/台农芒果采后糖处理实验分析.pptx",
]
mode = "individual"
timeout = 300

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "R01"
description = "PPT 应围绕“台农芒果采后糖处理实验分析”展开，明确实验对象、处理组别、采样时间、测定指标和报告目标，避免泛泛讲芒果成熟或农业常识。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R02"
description = "PPT 应具备实验报告的基本章节结构，包括实验设计、数据结果、统计分析、机制解释、综合结论、实践建议或局限说明、参考文献等主要部分。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R03"
description = "实验设计部分应说明品种/材料、对照组与糖处理组、采样时间点、重复数、测定指标和统计方法，使读者能理解实验方案全貌。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R04"
description = "PPT 应覆盖 TSS、果实硬度、蔗糖含量、I₂-KI 染色四类核心指标；若缺失其中任一核心指标，应明显影响得分。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R05"
description = "TSS、硬度、蔗糖含量三项指标应展示原始重复数据或足以追溯的原始数据表，不应只给趋势描述或孤立均值。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R06"
description = "数据表、图表和文字解读之间应保持一致，不得出现同一指标在不同页面数值矛盾、单位错误、处理组混淆或时间点错配。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R07"
description = "统计结论应与数据趋势一致；不得将不显著差异表述为显著，不得忽略边缘显著或组间趋同等重要统计现象。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R08"
description = "机制分析应构建从外源糖处理到采后成熟变化的因果链，至少覆盖糖信号/乙烯、淀粉水解、蔗糖合成、TSS 积累、细胞壁降解或硬度下降等关键环节。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R09"
description = "机制解释应与本实验数据对应，能够用具体时间点、处理组差异或指标变化支撑机制推断，而不是只堆砌通用生理学概念。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R10"
description = "PPT 应关注并分析处理组与对照组之间的动态变化趋势差异，包括早期可能的抑制现象和后期的反超趋势，并给出合理的机制解释。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R11"
description = "PPT 应讨论四指标之间的互证关系，说明 I₂-KI 染色变浅、蔗糖含量上升、TSS 上升、硬度下降之间如何共同支持成熟进程加速。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R12"
description = "PPT 应提供指标间的定量关系分析，例如蔗糖与 TSS、蔗糖与硬度、TSS 与硬度之间的相关系数、回归关系或其他定量关联证据。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R13"
description = "I₂-KI 染色页面应展示染色图片或可识别的染色结果，并解释染色原理：颜色深浅或染色面积主要反映淀粉含量变化。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R14"
description = "I₂-KI 染色解读应边界清晰：可以将染色变浅作为淀粉减少和成熟推进的佐证，并与 TSS、蔗糖、硬度进行互证；但不得声称染色结果直接证明细胞壁降解酶活、汁液渗出或软化机制。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R15"
description = "文献证据应支撑机制分析，建议覆盖糖信号/乙烯、淀粉水解/糖代谢、蔗糖合成、细胞壁降解/软化等主题，而不是集中在单一方向。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R16"
description = "参考文献应基本满足科研汇报需要，通常建议不少于 8篇；若文献少于 8 篇，或虽数量较多但大多与本实验机制无关、无法支撑正文判断，则判定不满足。若文献数量为 8-10 篇但覆盖糖信号/乙烯、淀粉代谢、糖积累、软化机制等关键方向，且与正文机制分析对应，可判定满足。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R17"
description = "文献引用应与正文机制段落对应，关键机制判断应能在相关文献或实验数据中找到支撑，不应只在参考文献页堆列表。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R18"
description = "综合结论应总结核心发现，包括糖处理对 TSS、硬度、蔗糖含量、I₂-KI 染色结果的影响，以及关键时间点或关键拐点。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R19"
description = "综合结论应比较蔗糖、果糖、葡萄糖三种处理的差异化表现，例如增糖效果、催熟/软化速度、最终品质或应用价值。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R20"
description = "PPT 应给出实践建议或应用启示，例如最佳处理选择、最佳食用/采样窗口、后续验证方向或采后管理建议。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R21"
description = "PPT 应说明实验局限或后续改进方向，例如样本量、处理浓度、酶活/乙烯指标缺失、图像定量不足等。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R22"
description = "PPT 页面结构应清晰，标题、分区、图表、结论之间层级明确，适合科研组会或项目汇报阅读。"
type = "binary"
weight = 7.0

[[criterion]]
id = "R23"
description = "图表和表格应具备良好可读性（参考文献页除外），包括单位、图例、坐标轴、显著性标记、数据来源等必要信息，避免过小、拥挤或难以辨认。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R24"
description = "PPT 应避免大段堆字（参考文献页除外）和模板化空话，页面内容应围绕数据发现、机制解释和结论推进，保持信息密度与可读性的平衡。"
type = "binary"
weight = 3.0

[[criterion]]
id = "R25"
description = "PPT 仅罗列通用农业知识、成熟机制或文献摘要，缺少对本实验数据的具体分析"
type = "binary"
weight = 7.0
negate = true

[[criterion]]
id = "R26"
description = "缺少其中一维度的数据分析页、统计页、结论页或参考文献页中的多个部分，表现为明显半成品"
type = "binary"
weight = 10.0
negate = true

[[criterion]]
id = "R27"
description = "PPT 出现大量无依据的绝对化表述、夸大应用效果或超出实验数据支持范围（过度推断等）的结论，应扣分。"
type = "binary"
weight = 10.0
negate = true

[[criterion]]
id = "R28"
description = "所有数据图表（折线图、柱状图等）不得将生物学重复作为独立数据点逐个画出。必须对每组生物学重复取算术平均值后作图。横坐标（分类轴）应仅包含各处理组名称，不得出现按重复编号后缀的分类项。图例项数量应等于处理组数，而非处理组数×重复数。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R29"
description = "凡展示均值的图表，应呈现标准差误差棒（±SD），并在图表注释、图例或页面说明中明确误差棒代表 SD。误差棒数值应与每组重复数据计算得到的样本标准差基本一致，不得用 SEM 替代 SD。若图表由于软件实现原因内部属性命名不准确，但页面明确标注为 ±SD，且误差棒数值与 SD 一致，可判定满足；若缺少误差棒、误差棒含义不明，或误差棒数值明显为 SEM/错误值，则判定不满足。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R30"
description = "凡本实验未直接测定的酶活性或基因表达水平，在 PPT 中涉及时必须明确标注为\"推测\"\"可能\"\"据文献推测\"等限定措辞，不得作为实验的主要结论陈述。若将未测定的酶活/基因表达变化作为既定事实呈现，则属于过度解读。不得出现将文献推测的酶活数据当作实验测得数据的情况。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R31"
description = "由于本实验未测定基因表达、酶活性或乙烯释放量，PPT 中凡涉及未测定基因/酶/激素通路的因果链描述，必须清晰标注为推测、可能机制、文献推演或待验证机制，不得作为本实验已证实机制呈现。具体要求：（1）相关页面标题或小标题应体现“推测/可能/文献推演/待验证”等限定；（2）综合结论中不得将未测定通路表述为已验证的“核心机制”，应使用“核心推测机制”“可能机制链条”等限定表述；（3）页面注释或说明应区分“本实验数据支持的现象”和“文献推测的机制解释”；（4）局限性部分应明确说明机制链条主要基于文献推演，仍需酶活、基因表达或乙烯释放量等实验进一步验证。若 PPT 多处将未测定的基因表达、酶活性或乙烯变化作为本实验直接结果、主要发现或确定机制陈述，则判定不满足。"

type = "binary"
weight = 10.0

[[criterion]]
id = "R32"
description = "PPT 中引用的核心文献应真实存在，且题名、作者、年份、期刊/出版源、DOI 或可检索链接等关键信息应足以支持检索核验。不得编造不存在的文献，不得把文献内容明显张冠李戴。若个别非核心书目信息存在轻微格式问题、页码缺失或卷期不完整，但文献真实可查且正文引用含义基本准确，可不判为不满足；若存在虚假文献、关键书目信息错误导致无法检索，或正文引用与文献内容明显不符，则判定不满足。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R33"
description = "I₂-KI 染色结果页应以淀粉含量变化为主要解读对象：染色深浅和面积大小仅用于说明淀粉含量高低。该页面不得直接把染色结果外推为细胞壁降解、果实软化、汁液渗出或相关酶活变化的直接证据。允许在综合结论页或机制推测页中，将染色变浅作为成熟进程的辅助证据，与 TSS、蔗糖含量、硬度等指标进行整体互证，但必须明确其直接指向是淀粉含量变化。"
type = "binary"
weight = 10.0

[[criterion]]
id = "R34"
description = "I₂-KI 染色原理应准确表述为：淀粉遇碘显蓝色/黑色，染色越深或面积越大通常表示淀粉含量越高，染色越浅或面积越小通常表示淀粉含量越低。染色原理本身不得被表述为直接测定淀粉水解速率或相关酶活。若页面进一步讨论成熟过程中淀粉可能水解为可溶性糖，应明确这是结合文献或其他指标作出的机制推测，而不是 I₂-KI 染色单独证明的结果。"
type = "binary"
weight = 10.0
